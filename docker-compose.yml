services:
  pokemon-agent:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # Datadog env tag; `version` is resolved from .git at runtime (backend/build_info.py).
      # Never set DD_VERSION here or in Dokploy: a static value freezes it across deploys.
      DD_ENV: ${DD_ENV:-prod}
    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    volumes:
      - pokemon_data:/app/data

    networks:
      - dokploy-network

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mcpokedex.rule=Host(`mcpokedex.shimadev.xyz`) || Host(`mcpokedex.com`) || Host(`www.mcpokedex.com`)"
      - "traefik.http.routers.mcpokedex.entrypoints=websecure"
      - "traefik.http.routers.mcpokedex.tls.certresolver=letsencrypt"
      - "traefik.http.routers.mcpokedex.service=mcpokedex"
      - "traefik.http.services.mcpokedex.loadbalancer.server.port=8000"
      - "traefik.http.routers.mcpokedex-http.rule=Host(`mcpokedex.com`) || Host(`www.mcpokedex.com`)"
      - "traefik.http.routers.mcpokedex-http.entrypoints=web"
      - "traefik.http.routers.mcpokedex-http.middlewares=redirect-to-https@file"
      - "traefik.http.routers.mcpokedex-http.service=mcpokedex"

networks:
  dokploy-network:
    external: true

volumes:
  pokemon_data:
